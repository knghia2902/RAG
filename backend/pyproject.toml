[project]
name = "logistics-rag"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.142.2", "uvicorn==0.54.0", "sqlalchemy==2.0.54",
  "alembic==1.20.0", "psycopg[binary]==3.3.6", "pwdlib[argon2]==0.3.1",
  "pydantic-settings==2.15.0", "pytest==9.1.1", "httpx==0.28.1",
  "python-multipart==0.0.32", "docling==2.132.0", "openpyxl==3.1.5", "celery==5.4.0",
  "pgvector>=0.3.6", "openai>=1.50.0", "weasyprint==70.0",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider --import-mode=importlib"
